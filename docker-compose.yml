# Máy Server cho buổi demo LAN: MySQL + ZTNA Server + giao diện web.
# Chạy:  copy .env.example .env  (sửa giá trị)  rồi  docker compose up -d --build
# Máy khác trong LAN: mở http://<IP-máy-này>:3000, Agent/Connector trỏ tới ws://<IP-máy-này>:9443/app và :8443/connector
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Đặt DB_PASSWORD trong file .env}
      MYSQL_DATABASE: ztna_db
    volumes:
      - ztna_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  server:
    build: ./ztna-server
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ztna_db
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Đặt JWT_SECRET (>= 32 ký tự) trong file .env}
    ports:
      - "443:443"
      - "8443:8443"
      - "9443:9443"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./ztna-portal-ui
    ports:
      - "3000:3000"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  ztna_mysql:
