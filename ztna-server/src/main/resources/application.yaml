# Cấu hình qua biến môi trường (có giá trị mặc định cho máy dev). Danh sách biến: xem .env.example ở thư mục gốc.
server:
  port: ${SERVER_PORT:443}
spring:
  application:
    name: ztna-server

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ztna_db}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    # XAMPP mặc định root không mật khẩu: đặt biến môi trường DB_PASSWORD rỗng. Docker: xem .env.example
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh




netty:
  port: 8443
  boss-threads: 1
  worker-threads: 8


logging:
  level:
    root: INFO
    com.ztna: DEBUG
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql.BasicBinder: warn

app:
  jwt:
    # Không để secret trong code. Không đặt JWT_SECRET thì server tự sinh secret ngẫu nhiên mỗi lần khởi động
    # (người dùng phải đăng nhập lại sau khi restart server). Demo nhiều máy: đặt JWT_SECRET >= 32 ký tự.
    secret: ${JWT_SECRET:}
    refresh-expiration-ms: 604800000
    access-expiration-ms: 900000