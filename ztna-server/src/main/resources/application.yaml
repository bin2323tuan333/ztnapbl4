server:
  port: 8080
spring:
  application:
    name: ztna-server

  datasource:
    url: jdbc:mysql://localhost:3306/ztna_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh


netty:
  port: 8443
  boss-threads: 1
  worker-threads: 8


jwt:
  secret: change-me-min-32-bytes-long-secret-please
  ttl-minutes: 60


connector:
  token: connector-demo-token-abc123

logging:
  level:
    root: INFO
    com.ztna: DEBUG
    org.hibernate.SQL: DEBUG